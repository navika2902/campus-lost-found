<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Lost & Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0f2fe, #f8fafc);
        }

        .register-container {
            width: 450px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .info {
            background: #eff6ff;
            color: #1e40af;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #94a3b8;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .login {
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .login a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .login a:hover {
            text-decoration: underline;
        }

        .message {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="logo">🔍</div>

    <h1>Create Account</h1>

    <p class="subtitle">
        Join your Campus Lost & Found
    </p>

    <div class="info">
        📱 You can register using your
        <strong>Email or Phone Number</strong>
    </div>

    <!-- Flask messages -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}


    <!-- REGISTER FORM -->
    <form method="POST" action="{{ url_for('register') }}">

        <!-- EMAIL OR PHONE -->
        <div class="input-group">

            <label for="contact">
                Email or Phone Number
            </label>

            <input
                type="text"
                id="contact"
                name="contact"
                placeholder="Enter email or phone number"
                autocomplete="username"
                required
            >

        </div>


        <!-- PASSWORD -->
        <div class="input-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                required
            >

        </div>


        <!-- CONFIRM PASSWORD -->
        <div class="input-group">

            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm your password"
                autocomplete="new-password"
                required
            >

        </div>


        <!-- CREATE ACCOUNT -->
        <button
            type="submit"
            class="register-btn">
            Create Account
        </button>

    </form>


    <div class="divider">
        OR
    </div>


    <div class="login">
        Already have an account?
        <a href="{{ url_for('login') }}">Login</a>
    </div>

</div>

</body>
</html>
