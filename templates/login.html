<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Lost & Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0f2fe, #f8fafc);
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 12px;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #94a3b8;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .create-account {
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .create-account a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .create-account a:hover {
            text-decoration: underline;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #64748b;
            font-size: 13px;
            text-decoration: none;
        }

        .back a:hover {
            color: #2563eb;
        }

        .message {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Logo -->
        <div class="logo">
            🔍
        </div>

        <!-- Heading -->
        <h1>Welcome Back!</h1>

        <p class="subtitle">
            Login to your Lost & Found account
        </p>


        <!-- Flask Error / Success Messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}


        <!-- LOGIN FORM -->
        <form method="POST" action="{{ url_for('login') }}">

            <!-- EMAIL OR PHONE -->
            <div class="input-group">

                <label for="contact">
                    Email or Phone Number
                </label>

                <input
                    type="text"
                    id="contact"
                    name="contact"
                    placeholder="Enter your email or phone number"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->
            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->
            <button
                type="submit"
                class="login-btn">
                Login
            </button>

        </form>


        <!-- DIVIDER -->
        <div class="divider">
            OR
        </div>


        <!-- CREATE ACCOUNT -->
        <div class="create-account">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </div>


        <!-- BACK -->
        <div class="back">

            <a href="{{ url_for('home') }}">
                ← Back to Lost & Found
            </a>

        </div>

    </div>

</body>

</html>
